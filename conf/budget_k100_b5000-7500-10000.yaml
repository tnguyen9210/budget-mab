defaults:
  - exp_schema
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

# Same as budget_k10_b5000-7500-10000.yaml (all 3 regimes, default
# 7-algorithm set, n_seeds=500, budgets=[5000,7500,10000]) but at
# K=100 -- the paper's actual arm count (Section 5), instead of this
# repo's smaller K=10 default. Lets a direct K=10-vs-K=100 comparison
# at the same budget grid. `name` doubles as the output filename
# stem (results/<name>.pkl, .json); the figure this produces should
# be renamed figure1_<name-minus-'budget_'-prefix>.png/.pdf after
# running plot_results.py, since that script always writes
# figure1.png/.pdf regardless of input name.
name: budget_k100_b5000-7500-10000
K: 100
n_seeds: 500
regimes: [homogeneous, moderate, extreme]
instance_seed: 42
n_workers: 96
budgets: [5000, 7500, 10000]
