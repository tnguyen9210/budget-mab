defaults:
  - exp_schema
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

# Same as budget_k10_b5000-7500-10000.yaml (K=10, all 3 regimes,
# default 7-algorithm set, n_seeds=500) but at a smaller budget grid:
# 1000/2500/5000, closer to the paper's own tested range (500-4000)
# than the 5000-10000 grid was. `name` doubles as the output filename
# stem (results/<name>.pkl, .json); the figure this produces should
# be renamed figure1_<name-minus-'budget_'-prefix>.png/.pdf after
# running plot_results.py, since that script always writes
# figure1.png/.pdf regardless of input name.
name: budget_k10_b1000-2500-5000
K: 10
n_seeds: 500
regimes: [homogeneous, moderate, extreme]
instance_seed: 42
n_workers: 96
budgets: [1000, 2500, 5000]
